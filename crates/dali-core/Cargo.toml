[package]
name = "dali-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LUBA protocol driver, DALI frame decoder and commissioning logic for Lunatone DALI-2 USB interfaces"

[dependencies]
serde = { version = "1", features = ["derive"] }
serialport = "4"
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "1"
log = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "fs"] }

[dev-dependencies]
env_logger = "0.11"
serde_json = "1"

[[bin]]
name = "dali-sim"
path = "src/bin/dali_sim.rs"
